services:
  coworkpal-sync:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      MAX_VERSIONS: "30"
      MAX_PENDING_REQUESTS: ${MAX_PENDING_REQUESTS:-200}
      COWORKPAL_USERS_JSON: ${COWORKPAL_USERS_JSON:?set COWORKPAL_USERS_JSON in .env}
      COWORKPAL_ADMIN_TOKEN: ${COWORKPAL_ADMIN_TOKEN:?set COWORKPAL_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:${COWORKPAL_SYNC_PORT:-8080}:8080"
    volumes:
      - coworkpal-sync-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  coworkpal-sync-data:
